---

services:

    asterisk:
        image: ${PANORAMISK_ASTERISK_IMAGE:-andrius/asterisk:latest}
        ports:
            - "127.0.0.1:${PANORAMISK_AMI_PORT:-5038}:5038"
        volumes:
            - ./etc/manager.conf:/etc/asterisk/manager.conf:ro
            - ./etc/modules.conf:/etc/asterisk/modules.conf:ro
        entrypoint: ["/usr/sbin/asterisk", "-f", "-vvv"]
        command: []
